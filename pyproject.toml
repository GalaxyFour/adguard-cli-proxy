[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adguard-cli-proxy"
version = "0.3.1"
description = "Location-aware SOCKS5 proxy gateway for the AdGuard VPN CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GalaxyFour" }]
keywords = ["adguard", "vpn", "socks5", "proxy", "cli"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
adguard-cli-proxy = "adguard_cli_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/GalaxyFour/adguard-cli-proxy"
Issues = "https://github.com/GalaxyFour/adguard-cli-proxy/issues"

[tool.setuptools.packages.find]
where = ["src"]
